meta:
  version: 1
  n_structures_hint: 44
  families:
  - dense_bulk
  - layered_bulk
  - explicit_vacuum_slab
  - intrinsic_2d_like
  - chain_solid
  - isolated_chain
  - molecular_crystal
  - isolated_molecule
  - stretched_layer
  - high_coordination
  - low_coordination
  morphology_classes_source: contracts.md §3.5 (frozen mirror in src/ckt/controls.py)
  definitions:
    expected_d_star: Physical ground-truth periodic bonding-network dimensionality of the material (0/1/2/3), independent of any cutoff choice. Finite clusters (incl. finite chains and molecules in boxes) are 0 per contracts.md §3.3.
    expected_short_lambda_dim: "d(lambda) produced by the frozen default-covalent-table algorithm (contracts.md §3.2/§3.3: edge iff d_ij < lambda*(r_cov_i+r_cov_j) with ASE Cordero covalent radii; self-loops excluded; d = rank of loop-translation vectors per connected component, max over components; rank computed by fixpoint greedy integer basis reduction, verified == real rank). Keys are lambda strings. Where ['1.00'] != expected_d_star the structure is a documented Cordero under-bonding case."
    expected_mean_cn: 'Physical CN reference: pymatgen CrystalNN when it succeeds and matches the hand-set histogram; else documented 1.25x-covalent shell rule (d < 1.25*(r_i+r_j)); cn_method records which.'
    expected_validity: 'L0 quantities per contracts.md §3.4/§5: q_min over the lambda=1.3 bond set (fallback 1.5), volume_norm V/sum(4pi/3 r_cov^3), cell_kappa = cond(cell), aspect = max/min cell length; flags with pilot defaults (q_c=0.85, nu in [0.5,10], kappa<=100, aspect<=10).'
    expected_vacuum_gap: 'Pilot-simple vacuum estimate per contracts.md §3.5 wording: for each lattice-axis projection, largest CIRCULAR gap in fractional coordinate minus covalent radii of the flanking atoms; max over axes, clamped at 0. For a symmetric slab (vacuum on both sides) the circular interval merges the two vacuum regions across the periodic boundary, so the value reports the TOTAL vacuum (2x per-side; per-side values are quoted in the structure notes). Reference magnitude for tests/figures, not the level2 implementation.'
    expected_site_geometries: Hand-set coordination geometry for inequivalent sites using the frozen GEOMETRY_LABELS of contracts.md §3.7 ('other' = shape not in the list; see notes).
    notes: Construction details + documented expected-flag / under-bonding behaviour.
