[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crysh"
version = "0.1.0.dev0"
description = "CrysH — a multi-layer crystal knowledge mapper: from structural validity to local building blocks and motif networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Qiyu Zeng", email = "zengqiyu15@163.com" }]
keywords = ["crystal", "materials-informatics", "coordination", "topology", "motif", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# 核心库刻意保持精简：只依赖 numpy + ase。
# parquet/表格写出在可选 extra [tables]；研究工具（pymatgen 对照、figdata、出图）在 [research]。
dependencies = [
  "numpy>=1.26",
  "ase>=3.22",
]

[project.optional-dependencies]
tables = ["pandas>=2.1", "pyarrow>=14"]
# controls 的标签读写：ruamel 用来**写回** labels.yaml（保留手写排版）；只读可用 PyYAML 代替
controls = ["ruamel.yaml>=0.18"]
research = ["crysh[tables,controls]", "pymatgen>=2024.1", "matplotlib>=3.8"]
# dev 带 PyYAML：core/tables 两档不装 ruamel，也能读 controls/data/labels.yaml
dev = ["pytest>=8", "ruff>=0.6", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/mingzhong15/CrysH"
Issues = "https://github.com/mingzhong15/CrysH/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crysh = ["tables/*.json", "controls_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 分层：**目录即边界**（见 tests/{tables,research}/conftest.py、.github/workflows/ci.yml）
#   pytest tests --ignore=tests/tables --ignore=tests/research   core：只装 numpy+ase(+dev)
#   pytest tests --ignore=tests/research                         tables：需 crysh[tables]
#   pytest tests                                                 research：需 crysh[research]
# 另：controls 的 CN 参考方法由 build_all(cn_method=...) / $CRYSH_CN_METHOD 显式选定，
# 默认 "crystalnn" 需 pymatgen；tables/core 档的用例显式传 "shell"（无依赖）。
addopts = "--import-mode=prepend"
norecursedirs = ["data", "fig", "__pycache__", "*.egg"]
# 旧的标记式选档（-m "not research"）保留兼容；分层的权威边界是目录，CI 用 --ignore 选档。
markers = ["research: 需要 crysh[research] 依赖的用例（分层以目录为准）"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 说明（2026-09-17 R2 定案）：本库是数值内核，下列规则在数值代码里是噪音或已知误报，
# 故显式关闭而不是到处撒 noqa：
#   E501 行长（数值表达式与中文注释混排，硬折行反而难读）
#   B905 zip 无 strict=（改 strict 会在长度不等时抛错，属行为变更，需单独评审）
#   E741 变量名 l（矩阵/角量子数惯用名，物理代码里不该改）
#   B007 循环变量未用（多处是"照契约解包"的占位）
#   B023 闭包捕获循环变量（oracle.py 的 BFS 内层函数是同步调用，语义正确）
#   E402 模块级 import 不在文件顶部（有意的"先定义常量再 import 重模块"布局）
ignore = ["E501", "B905", "E741", "B007", "B023", "E402"]
