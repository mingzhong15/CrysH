name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ① 核心：只装 numpy + ase —— 这是库的"最小可用面"，必须永远绿。
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test (core only, no optional deps)
        run: pytest tests -q --ignore=tests/tables --ignore=tests/research

  # ② 表格层：+ pandas/pyarrow（records 落盘、字号 fixture 构造）
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (tables extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tables]"
      - name: Test (tables tier)
        run: pytest tests -q --ignore=tests/research

  # ③ 研究层：+ pymatgen/matplotlib（oracle 对照、出图）
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (research extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Test (research tier)
        run: pytest tests -q
